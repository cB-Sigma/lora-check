[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lora-check"
dynamic = ["version"]
description = "Verify that an inference server is really applying the LoRA adapter you asked for: black-box endpoint probing, reference fingerprints and adapter linting."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The lora-check Authors" }]
keywords = ["lora", "peft", "vllm", "sglang", "llm", "inference", "serving", "testing", "adapters"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
# Needed only for `lora-check fingerprint` against real models.
# Install a CPU or CUDA build of torch that suits your machine first.
fingerprint = ["torch>=2.1", "transformers>=4.40", "peft>=0.11"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/cb-Sigma/lora-check"
Repository = "https://github.com/cb-Sigma/lora-check"
Issues = "https://github.com/cb-Sigma/lora-check/issues"
Changelog = "https://github.com/cb-Sigma/lora-check/blob/main/CHANGELOG.md"

[project.scripts]
lora-check = "lora_check.cli:main"

[tool.hatch.version]
path = "src/lora_check/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_check"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/scripts", "/README.md", "/CHANGELOG.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "realpeft: needs torch, transformers and peft plus access to a tiny Hugging Face model",
  "slow: statistical tests that run many simulated verifications",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PL", "PT"]
ignore = ["E501", "B905", "PLC0415", "PLR0917", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/lora_check", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "peft", "peft.*", "safetensors", "safetensors.*"]
ignore_missing_imports = true
follow_imports = "skip"
